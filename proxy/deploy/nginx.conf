server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name api.jasonluohs.me;

    ssl_certificate     /etc/letsencrypt/live/api.jasonluohs.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jasonluohs.me/privkey.pem;

    # Uploads: OCR images up to ~8 MB plus multipart overhead.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
