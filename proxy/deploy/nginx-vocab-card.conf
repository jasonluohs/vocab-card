# nginx reverse proxy for vocab-card API.
# Put in /etc/nginx/sites-available/vocab-card, symlink into sites-enabled.
#
# If the Aliyun server is in mainland China, serving a domain on ports
# 80/443 requires ICP filing. Workaround: serve the proxy on a
# non-standard HTTPS port such as 8443 (also open it in the Aliyun
# security group), and use https://api.yourdomain.com:8443 as the
# VITE_API_PROXY_URL. certbot's standalone or webroot HTTP-01 challenge
# can still use port 80 for renewal only — or use DNS-01.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # Uploads: OCR images up to ~8 MB plus multipart overhead.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
