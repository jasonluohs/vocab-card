name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Repo layout expectation: this repository's root contains `web/` and `proxy/`
# (i.e. push the vocab-card/ directory contents as the repo root).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # Must match the GitHub Pages project path: /<repo-name>/.
          VITE_BASE: ${{ vars.VITE_BASE || '/vocab-card/' }}
          # Public proxy URL — NOT a secret.
          VITE_API_PROXY_URL: ${{ vars.VITE_API_PROXY_URL }}

      - name: Run tests
        working-directory: web
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
